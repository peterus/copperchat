name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not kicad"
      - name: Docs and pins guard
        run: bash scripts/check-docs.sh
        working-directory: .

  kicad-commits:
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.list.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # One full commit hash per line; `#` comments and blank lines allowed (Phase 2).
        run: |
          commits=$(grep -Ev '^\s*(#|$)' docker/kicad-base/SUPPORTED_COMMITS | tr -d '[:blank:]' | jq -R . | jq -sc .)
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "supported: $commits"

  kicad:
    # Real-KiCad tests against every supported kicad-base tag.
    needs: kicad-commits
    name: kicad (${{ matrix.commit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJson(needs.kicad-commits.outputs.commits) }}
    container:
      image: ghcr.io/peterus/copperchat-kicad-base:${{ matrix.commit }}
      # The /__w workspace belongs to the runner uid; checkout and setup-uv need root (X13).
      options: --user root
    env:
      COPPERCHAT_REQUIRE_KICAD: "1"
      LANG: C
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run pytest -m kicad

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: ./scripts/check-kicanvas.sh
      # Real KiCanvas bundle on the KiCad 11 fixtures (API mocked), desktop + phone emulation.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line

  kicanvas-reproducible:
    # The committed bundle must be exactly what the pinned commit + patch series builds to.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./scripts/vendor-kicanvas.sh
      - run: git diff --exit-code -- public/vendor/kicanvas

  e2e:
    # The real app image: token-missing refusal, then the fake agent + ecc83 fixture end to end.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the KiCad base image is ~3 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - id: kc
        run: echo "commit=$(tr -d '[:space:]' < docker/kicad-base/KICAD_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          build-args: KICAD_COMMIT=${{ steps.kc.outputs.commit }}
          load: true
          push: false
          tags: copperchat:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=min
      - name: No token → non-zero exit with the setup-token hint
        run: bash scripts/e2e-token-missing.sh copperchat:ci
      - name: Runtime binaries (pdftoppm for PDF reads) on PATH for the app user
        run: bash scripts/app-image-tools.sh copperchat:ci
      - name: Start the app with the fake agent and the ecc83 fixture
        run: |
          mkdir -p "$RUNNER_TEMP/projects" "$RUNNER_TEMP/data"
          cp -r backend/tests/fixtures/projects/ecc83 "$RUNNER_TEMP/projects/"
          sudo chown -R 1000:1000 "$RUNNER_TEMP/projects" "$RUNNER_TEMP/data"
          docker run -d --name cc -p 8080:8080 -e DEV_FAKE_AGENT=true -e ADMIN_PASSWORD=secret \
            -e COOKIE_SECURE=false -v "$RUNNER_TEMP/projects:/projects" -v "$RUNNER_TEMP/data:/data" copperchat:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 2; done
          docker logs cc; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test e2e/smoke-docker.spec.ts --project=desktop --project=phone --reporter=line
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_PASSWORD: secret
      - if: always()
        run: docker logs cc || true
