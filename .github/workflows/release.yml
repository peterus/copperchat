name: Release

# For a pushed tag v<version>: publishes ghcr.io/peterus/copperchat:<version> (+ :<major>.<minor>
# and :latest for non-prerelease versions) with provenance and SBOM attestations, then creates
# the GitHub Release with the version's CHANGELOG.md section as notes. Never runs for pull
# requests or branches.
#   git tag -a v0.1.0 -m "CopperChat v0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/peterus/copperchat

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          # The tag must match the version in the tree (scripts/check-docs.sh keeps pyproject,
          # __init__, package.json and CHANGELOG.md in sync).
          declared="$(sed -nE 's/^version = "(.*)"$/\1/p' backend/pyproject.toml | head -n1)"
          [[ "${version%%-*}" == "$declared" ]] \
            || { echo "tag $GITHUB_REF_NAME does not match backend/pyproject.toml $declared"; exit 1; }
          commit="$(tr -d '[:space:]' < docker/kicad-base/KICAD_COMMIT)"
          tags="$IMAGE:$version"
          prerelease=true
          if [[ "$version" != *-* ]]; then  # prereleases never move :<major>.<minor> or :latest
            prerelease=false
            grep -q "^## \[$version\]" CHANGELOG.md \
              || { echo "CHANGELOG.md has no section for $version"; exit 1; }
            tags="$tags"$'\n'"$IMAGE:$minor"$'\n'"$IMAGE:latest"
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$commit"
            echo "created=$(git log -1 --format=%cI)"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version $version (prerelease $prerelease), KiCad $commit, tags: ${tags//$'\n'/ }"
      - name: Free disk space (the KiCad base image is ~3 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (load for the checks below)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          build-args: KICAD_COMMIT=${{ steps.meta.outputs.commit }}
          load: true
          push: false
          provenance: false
          tags: copperchat:release
          # source, title, description and licenses come from docker/app/Dockerfile.
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
      - name: No token → non-zero exit with the setup-token hint
        run: bash scripts/e2e-token-missing.sh copperchat:release
      # Same inputs as the build above, so every layer comes from the builder's cache; this
      # step only adds the attestations (docker push of a loaded image cannot carry them).
      - name: Push with provenance and SBOM
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          build-args: KICAD_COMMIT=${{ steps.meta.outputs.commit }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo "Digest: \`$DIGEST\`"
            echo
            while read -r tag; do echo "- \`$tag\`"; done <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image.outputs.version }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          # The version's CHANGELOG.md section, without its heading and the link references.
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "Prerelease of CopperChat $VERSION." > notes.md
          {
            echo
            echo "### Container image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
          } >> notes.md
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "CopperChat $GITHUB_REF_NAME" \
              --notes-file notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "CopperChat $GITHUB_REF_NAME" \
              --notes-file notes.md "${flags[@]}"
          fi
