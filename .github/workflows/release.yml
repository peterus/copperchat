name: Release

# Publishes ghcr.io/peterus/copperchat:<version> (+ :latest for non-prerelease versions) for
# a pushed tag v<version>. Never runs for pull requests or branches.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/peterus/copperchat

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
          commit="$(tr -d '[:space:]' < docker/kicad-base/KICAD_COMMIT)"
          tags="$IMAGE:$version"
          [[ "$version" == *-* ]] || tags="$tags,$IMAGE:latest"  # prereleases never move latest
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, KiCad $commit, tags $tags"
      - name: Free disk space (the KiCad base image is ~3 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (load for the checks below)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          build-args: KICAD_COMMIT=${{ steps.meta.outputs.commit }}
          load: true
          push: false
          provenance: false
          tags: copperchat:release
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
      - name: No token → non-zero exit with the setup-token hint
        run: bash scripts/e2e-token-missing.sh copperchat:release
      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IFS=, read -ra list <<<"$TAGS"
          for tag in "${list[@]}"; do
            docker tag copperchat:release "$tag"
            docker push "$tag"
          done
