name: kicad-base

# Builds KiCad from source at docker/kicad-base/KICAD_COMMIT and publishes
# ghcr.io/peterus/copperchat-kicad-base. Tags:
#
#   <commit>, <first 10> the published image (docker-compose.yml, releases). Built and
#                        pushed only by runs on main, whenever its io.copperchat.recipe
#                        label differs from the current recipe (also for a new commit).
#   <commit>-r<recipe>   recipe-pinned (scripts/kicad-base-image.sh: <recipe> hashes
#                        docker/kicad-base/*). A pull request that changes
#                        the recipe pushes its build here, so CI (ci.yml) can test it without
#                        touching <commit>. Only CI test jobs use it; main rebuilds rather
#                        than promote a pull request's image, and overwrites this tag.
#   ccache               the compiler cache of main's last build (scratch image). Every build
#                        is seeded from it; only main writes it, so a branch cannot poison
#                        main's compiles. Pull requests also keep their own cache in the
#                        branch-scoped Actions cache for their next run.
#
# Every built image is smoke-tested before it is pushed, and the published image again.

on:
  push:
    branches: [main]
    paths: ["docker/kicad-base/**", "scripts/kicad-base-smoke.sh", "scripts/kicad-base-image.sh", ".github/workflows/kicad-base.yml"]
  pull_request:
    paths: ["docker/kicad-base/**", "scripts/kicad-base-smoke.sh", "scripts/kicad-base-image.sh", ".github/workflows/kicad-base.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the recipe is published (only main overwrites tags)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: kicad-base-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/peterus/copperchat-kicad-base

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pins.outputs.commit }}
      short: ${{ steps.pins.outputs.short }}
      kipy: ${{ steps.pins.outputs.kipy }}
      recipe: ${{ steps.pins.outputs.recipe }}
      rtag: ${{ steps.pins.outputs.rtag }}
      build: ${{ steps.decide.outputs.build }}
      push_rtag: ${{ steps.decide.outputs.push_rtag }}
      push_commit: ${{ steps.decide.outputs.push_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: |
          commit="$(tr -d '[:space:]' < docker/kicad-base/KICAD_COMMIT)"
          kipy="$(tr -d '[:space:]' < docker/kicad-base/KIPY_COMMIT)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "bad KICAD_COMMIT: $commit"; exit 1; }
          [[ "$kipy" =~ ^[0-9a-f]{40}$ ]] || { echo "bad KIPY_COMMIT: $kipy"; exit 1; }
          grep -qx "$commit" docker/kicad-base/SUPPORTED_COMMITS \
            || { echo "KICAD_COMMIT is not listed in SUPPORTED_COMMITS"; exit 1; }
          recipe="$(scripts/kicad-base-image.sh recipe)"
          {
            echo "commit=$commit"
            echo "short=${commit:0:10}"
            echo "kipy=$kipy"
            echo "recipe=$recipe"
            echo "rtag=$commit-r$recipe"
          } >> "$GITHUB_OUTPUT"
          echo "KiCad $commit, kipy $kipy, recipe $recipe"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        env:
          COMMIT: ${{ steps.pins.outputs.commit }}
          FORCE: ${{ inputs.force || 'false' }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          decision="$(scripts/kicad-base-image.sh decide)"
          echo "$decision"
          echo "$decision" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # GitHub-hosted jobs are capped at 6 h; a cold build takes ~2 h 15 min. ccache
    # lives in a BuildKit cache mount that is seeded before and exported after the
    # build: main reads and writes the `ccache` image, other branches read their own
    # Actions cache (else main's image) and save to their Actions cache.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ccache: this branch's own cache (Actions cache, branch-scoped) if there is one,
      # else main's (registry). Same cache id (/ccache) as the build stage's mount; the
      # seeded cache stays in the builder.
      - name: Restore this branch's ccache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache-local
          key: kicad-ccache-${{ github.run_id }}
          restore-keys: kicad-ccache-
      - name: Seed ccache
        run: |
          if [ -d ccache-local ] && [ -n "$(ls -A ccache-local)" ]; then
            echo "seeding from this branch's Actions cache"
            docker buildx build --progress=plain -f - ccache-local <<'EOF'
          FROM debian:trixie
          RUN --mount=type=bind,target=/seed --mount=type=cache,target=/ccache \
              cp -a /seed/. /ccache/ && du -sh /ccache
          EOF
            exit 0
          fi
          rc=0; scripts/kicad-base-image.sh label "$IMAGE:ccache" >/dev/null || rc=$?
          if [ "$rc" = 1 ]; then echo "no ccache image yet: cold build"; exit 0; fi
          [ "$rc" = 0 ] || { echo "::warning::ccache image not readable: cold build"; exit 0; }
          echo "seeding from main's ccache image"
          docker buildx build --progress=plain - <<EOF
          FROM debian:trixie
          RUN --mount=type=bind,from=$IMAGE:ccache,source=/ccache,target=/seed \
              --mount=type=cache,target=/ccache \
              cp -a /seed/. /ccache/ && du -sh /ccache
          EOF
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/kicad-base
          file: docker/kicad-base/Dockerfile
          build-args: |
            KICAD_COMMIT=${{ needs.meta.outputs.commit }}
            KIPY_REV=${{ needs.meta.outputs.kipy }}
            RECIPE=${{ needs.meta.outputs.recipe }}
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.rtag }}
            ${{ env.IMAGE }}:${{ needs.meta.outputs.commit }}
            ${{ env.IMAGE }}:${{ needs.meta.outputs.short }}
      - name: Image size
        run: |
          docker image inspect "$IMAGE:${{ needs.meta.outputs.rtag }}" --format '{{.Size}}' | numfmt --to=iec
          docker history "$IMAGE:${{ needs.meta.outputs.rtag }}" --format '{{.Size}}\t{{.CreatedBy}}' | cut -c1-100
      - name: Smoke (built image, before push)
        run: scripts/kicad-base-smoke.sh "$IMAGE:${{ needs.meta.outputs.rtag }}"
      - name: Push the recipe-pinned tag
        if: needs.meta.outputs.push_rtag == 'true'
        run: docker push "$IMAGE:${{ needs.meta.outputs.rtag }}"
      - name: Push <commit> and <short>
        if: needs.meta.outputs.push_commit == 'true'
        run: |
          docker push "$IMAGE:${{ needs.meta.outputs.commit }}"
          docker push "$IMAGE:${{ needs.meta.outputs.short }}"
      - name: Export ccache
        run: |
          # BUST: never reuse a cached export of an older cache state.
          cat > ccache-export.Dockerfile <<'EOF'
          FROM debian:trixie AS export
          ARG BUST
          RUN --mount=type=cache,target=/ccache echo "$BUST" && cp -a /ccache /export && du -sh /export
          FROM scratch AS local
          COPY --from=export /export /
          FROM scratch AS image
          LABEL org.opencontainers.image.source="https://github.com/peterus/copperchat" \
                org.opencontainers.image.description="ccache of the kicad-base build on main (CI only)"
          COPY --from=export /export /ccache
          EOF
          bust="${{ github.run_id }}-${{ github.run_attempt }}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker buildx build --progress=plain --target image --build-arg BUST="$bust" \
              --output "type=image,name=$IMAGE:ccache,push=true" - < ccache-export.Dockerfile
          else
            rm -rf ccache-local
            docker buildx build --progress=plain --target local --build-arg BUST="$bust" \
              --output type=local,dest=ccache-local - < ccache-export.Dockerfile
          fi
      - name: Save this branch's ccache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache-local
          key: kicad-ccache-${{ github.run_id }}

  smoke:
    needs: [meta, build]
    # The published image: after a push, or when nothing had to be built.
    if: >-
      always() && needs.meta.result == 'success' &&
      (needs.build.result == 'skipped' ||
       (needs.build.result == 'success' && (needs.meta.outputs.push_rtag == 'true' || needs.meta.outputs.push_commit == 'true')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke the image CI resolves for this recipe
        run: |
          ref="$(scripts/kicad-base-image.sh resolve "${{ needs.meta.outputs.commit }}")"
          echo "resolved: $ref"
          docker pull "$ref"
          scripts/kicad-base-smoke.sh "$ref"
      - name: On main, <commit> must carry this recipe
        if: github.ref == 'refs/heads/main'
        run: scripts/kicad-base-image.sh published "${{ needs.meta.outputs.commit }}"
      # ci.yml's base-dependent jobs fail while a new recipe is still being built; re-run
      # the latest CI run of this branch (any head pushed meanwhile, too) if it failed.
      - name: Re-run this branch's failed CI jobs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BRANCH" --limit 1 \
            --json databaseId,status,conclusion \
            -q '.[] | select(.status == "completed" and .conclusion == "failure") | .databaseId' \
          | while read -r id; do echo "re-running CI run $id"; gh run rerun "$id" --failed -R "$GITHUB_REPOSITORY"; done
