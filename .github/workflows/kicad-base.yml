name: kicad-base

# Builds KiCad from source at docker/kicad-base/KICAD_COMMIT and publishes
# ghcr.io/peterus/copperchat-kicad-base. Tags:
#
#   <commit>-r<recipe>   recipe-pinned (scripts/kicad-base-image.sh: <recipe> hashes
#                        docker/kicad-base/* and this workflow). Pushed by every same-repo
#                        run that builds it, never overwritten (except `force` on main).
#                        A pull request that changes the recipe publishes and tests its
#                        image under this tag without touching the published one; CI
#                        (ci.yml) resolves the tag per recipe.
#   <commit>, <first 10> the published image (docker-compose.yml, releases). Only runs on
#                        main move it -- by promoting the recipe-pinned tag a pull request
#                        already built and tested (no rebuild), or by building -- plus the
#                        first publication of a new commit from any same-repo run.
#   ccache               the compiler cache of the last same-repo build (scratch image),
#                        injected into the next build so a recipe change or a nearby KiCad
#                        commit does not recompile from scratch. Same-repo branches are
#                        trusted to write it, as they are trusted to push recipe tags.
#
# Every built image is smoke-tested before it is pushed, and the published image again.

on:
  push:
    branches: [main]
    paths: ["docker/kicad-base/**", "scripts/kicad-base-smoke.sh", "scripts/kicad-base-image.sh", ".github/workflows/kicad-base.yml"]
  pull_request:
    paths: ["docker/kicad-base/**", "scripts/kicad-base-smoke.sh", "scripts/kicad-base-image.sh", ".github/workflows/kicad-base.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the recipe is published (only main overwrites tags)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: kicad-base-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/peterus/copperchat-kicad-base

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pins.outputs.commit }}
      short: ${{ steps.pins.outputs.short }}
      kipy: ${{ steps.pins.outputs.kipy }}
      recipe: ${{ steps.pins.outputs.recipe }}
      rtag: ${{ steps.pins.outputs.rtag }}
      build: ${{ steps.decide.outputs.build }}
      push_rtag: ${{ steps.decide.outputs.push_rtag }}
      push_commit: ${{ steps.decide.outputs.push_commit }}
      promote: ${{ steps.decide.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: |
          commit="$(tr -d '[:space:]' < docker/kicad-base/KICAD_COMMIT)"
          kipy="$(tr -d '[:space:]' < docker/kicad-base/KIPY_COMMIT)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "bad KICAD_COMMIT: $commit"; exit 1; }
          [[ "$kipy" =~ ^[0-9a-f]{40}$ ]] || { echo "bad KIPY_COMMIT: $kipy"; exit 1; }
          grep -qx "$commit" docker/kicad-base/SUPPORTED_COMMITS \
            || { echo "KICAD_COMMIT is not listed in SUPPORTED_COMMITS"; exit 1; }
          recipe="$(scripts/kicad-base-image.sh recipe)"
          {
            echo "commit=$commit"
            echo "short=${commit:0:10}"
            echo "kipy=$kipy"
            echo "recipe=$recipe"
            echo "rtag=$commit-r$recipe"
          } >> "$GITHUB_OUTPUT"
          echo "KiCad $commit, kipy $kipy, recipe $recipe"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        env:
          COMMIT: ${{ steps.pins.outputs.commit }}
          RECIPE: ${{ steps.pins.outputs.recipe }}
          RTAG: ${{ steps.pins.outputs.rtag }}
          FORCE: ${{ inputs.force || 'false' }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # label: exit 1 = tag missing; any other failure (outage, auth, rate limit) aborts,
          # so a registry error is never mistaken for "missing" and pushed over.
          rc=0; scripts/kicad-base-image.sh label "$IMAGE:$RTAG" >/dev/null || rc=$?
          case "$rc" in 0) rexists=true ;; 1) rexists=false ;; *) exit 1 ;; esac
          rc=0; published="$(scripts/kicad-base-image.sh label "$IMAGE:$COMMIT")" || rc=$?
          case "$rc" in 0) exists=true ;; 1) exists=false; published="" ;; *) exit 1 ;; esac
          main=false; [ "$REF" = "refs/heads/main" ] && main=true
          echo "recipe tag exists: $rexists; <commit> tag exists: $exists, published recipe: '$published', current: $RECIPE"
          build=false; push_rtag=false; push_commit=false; promote=false
          if [ "$FORCE" = "true" ] || { [ "$rexists" = "false" ] && [ "$published" != "$RECIPE" ]; }; then
            build=true
            if [ "$SAME_REPO" = "true" ]; then
              { [ "$rexists" = "false" ] || [ "$main" = "true" ]; } && push_rtag=true
              { [ "$main" = "true" ] || [ "$exists" = "false" ]; } && push_commit=true
            fi
          elif [ "$main" = "true" ] && [ "$published" != "$RECIPE" ]; then
            promote=true   # a pull request built and tested this recipe: retag, no rebuild
          fi
          echo "build=$build push_rtag=$push_rtag push_commit=$push_commit promote=$promote"
          {
            echo "build=$build"; echo "push_rtag=$push_rtag"
            echo "push_commit=$push_commit"; echo "promote=$promote"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # GitHub-hosted jobs are capped at 6 h; a cold build takes ~2 h 15 min. ccache
    # lives in a BuildKit cache mount, seeded from and saved to the `ccache` image
    # (the registry is shared by all branches, unlike the Actions cache).
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Seed ccache from the registry
        run: |
          rc=0; scripts/kicad-base-image.sh label "$IMAGE:ccache" >/dev/null || rc=$?
          if [ "$rc" = 1 ]; then echo "no ccache image yet: cold build"; exit 0; fi
          [ "$rc" = 0 ] || { echo "::warning::ccache image not readable: cold build"; exit 0; }
          # Same cache id (/ccache) as the build stage's mount; the result stays in the builder.
          docker buildx build --progress=plain - <<EOF
          FROM debian:trixie
          RUN --mount=type=bind,from=$IMAGE:ccache,source=/ccache,target=/seed \
              --mount=type=cache,target=/ccache \
              cp -a /seed/. /ccache/ && du -sh /ccache
          EOF
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/kicad-base
          file: docker/kicad-base/Dockerfile
          build-args: |
            KICAD_COMMIT=${{ needs.meta.outputs.commit }}
            KIPY_REV=${{ needs.meta.outputs.kipy }}
            RECIPE=${{ needs.meta.outputs.recipe }}
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.rtag }}
            ${{ env.IMAGE }}:${{ needs.meta.outputs.commit }}
            ${{ env.IMAGE }}:${{ needs.meta.outputs.short }}
      - name: Image size
        run: |
          docker image inspect "$IMAGE:${{ needs.meta.outputs.rtag }}" --format '{{.Size}}' | numfmt --to=iec
          docker history "$IMAGE:${{ needs.meta.outputs.rtag }}" --format '{{.Size}}\t{{.CreatedBy}}' | cut -c1-100
      - name: Smoke (built image, before push)
        run: scripts/kicad-base-smoke.sh "$IMAGE:${{ needs.meta.outputs.rtag }}"
      - name: Push the recipe-pinned tag
        if: needs.meta.outputs.push_rtag == 'true'
        run: docker push "$IMAGE:${{ needs.meta.outputs.rtag }}"
      - name: Push <commit> and <short>
        if: needs.meta.outputs.push_commit == 'true'
        run: |
          docker push "$IMAGE:${{ needs.meta.outputs.commit }}"
          docker push "$IMAGE:${{ needs.meta.outputs.short }}"
      - name: Save ccache to the registry
        if: needs.meta.outputs.push_rtag == 'true' || needs.meta.outputs.push_commit == 'true'
        run: |
          # BUST: never reuse a cached export of an older cache state.
          docker buildx build --progress=plain --build-arg BUST="${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "type=image,name=$IMAGE:ccache,push=true" - <<EOF
          FROM debian:trixie AS export
          ARG BUST
          RUN --mount=type=cache,target=/ccache echo "\$BUST" && cp -a /ccache /export && du -sh /export
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/peterus/copperchat" \
                org.opencontainers.image.description="ccache of the kicad-base build (CI only)"
          COPY --from=export /export /ccache
          EOF

  promote:
    needs: meta
    if: needs.meta.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point <commit> and <short> at the recipe-pinned image
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ needs.meta.outputs.commit }}" -t "$IMAGE:${{ needs.meta.outputs.short }}" \
            "$IMAGE:${{ needs.meta.outputs.rtag }}"

  smoke:
    needs: [meta, build, promote]
    # The published image: after a push or a promotion, or when nothing had to be built.
    if: >-
      always() && needs.meta.result == 'success' && needs.promote.result != 'failure' &&
      (needs.build.result == 'skipped' || (needs.build.result == 'success' && needs.meta.outputs.push_rtag == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke the image CI resolves for this recipe
        run: |
          ref="$(scripts/kicad-base-image.sh resolve "${{ needs.meta.outputs.commit }}")"
          echo "resolved: $ref"
          docker pull "$ref"
          scripts/kicad-base-smoke.sh "$ref"
      - name: On main, <commit> must carry this recipe
        if: github.ref == 'refs/heads/main'
        run: |
          published="$(scripts/kicad-base-image.sh label "$IMAGE:${{ needs.meta.outputs.commit }}")"
          [ "$published" = "${{ needs.meta.outputs.recipe }}" ] \
            || { echo "<commit> tag has recipe '$published', expected ${{ needs.meta.outputs.recipe }}"; exit 1; }
      # ci.yml's base-dependent jobs fail while a new recipe is still being built.
      - name: Re-run this commit's failed CI jobs
        if: needs.meta.outputs.push_rtag == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --json databaseId,status,conclusion \
            -q '.[] | select(.status == "completed" and .conclusion == "failure") | .databaseId' \
          | while read -r id; do echo "re-running CI run $id"; gh run rerun "$id" --failed -R "$GITHUB_REPOSITORY"; done
