# Paths dpkg never unpacks in the runtime image (dpkg.cfg(5) path-exclude). The
# packages stay registered, so images built on top can still apt-get install.
#
# Documentation, manual pages and translations: the image runs with LANG=C.UTF-8
# and KiCad is built without i18n. Copyright files stay.
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/man/*
path-exclude=/usr/share/info/*
path-exclude=/usr/share/locale/*
path-include=/usr/share/locale/locale.alias
path-exclude=/usr/share/lintian/*
# OpenCASCADE sample models and test data (not the resources STEP export reads).
path-exclude=/usr/share/opencascade/data/*
path-exclude=/usr/share/opencascade/samples/*
# Mesa GL/EGL drivers and their LLVM backend. The image has no display and no GPU,
# and KiCad never creates a GL context headless (kicad-cli pcb render uses the CPU
# raytracer). The glvnd dispatch libraries and libgbm that KiCad, wxWidgets and
# WebKitGTK link against stay; only the dlopen()ed driver side goes.
path-exclude=/usr/lib/*/libgallium-*
path-exclude=/usr/lib/*/libLLVM*
path-exclude=/usr/lib/*/libz3.so*
path-exclude=/usr/lib/*/dri/*
path-exclude=/usr/lib/*/gbm/dri_gbm.so
path-exclude=/usr/lib/*/libGLX_mesa.so*
path-exclude=/usr/lib/*/libEGL_mesa.so*
path-exclude=/usr/share/glvnd/egl_vendor.d/50_mesa.json
