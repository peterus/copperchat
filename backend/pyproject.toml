[project]
name = "copperchat"
version = "0.1.0"
description = "CopperChat - chat with an AI agent about your KiCad project"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "kicad-python>=0.8.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
copperchat = "copperchat.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copperchat"]

# kicad-python 0.8.0 on PyPI is broken for KiCad 11 (see tests/unit/test_kipy_imports.py).
# Revision recorded in docs/spikes/1c-api-server.md ("kipy revision").
[tool.uv.sources]
kicad-python = { git = "https://gitlab.com/kicad/code/kicad-python.git", rev = "87b945a0d56b26a78bf547db9771ff9bf3a057ea" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
# Per-test limit: a hung api-server call must fail the test, never the whole run.
timeout = 180
markers = [
    "kicad: needs a real `kicad-cli api-server` (KiCad 11 master); run with -m kicad",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
